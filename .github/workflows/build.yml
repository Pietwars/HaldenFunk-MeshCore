name: HaldenFunk-MeshCore-Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  web-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/web_regression.cjs
      - name: Versionsangaben pruefen (einzige Quelle: platformio.local.ini [hf] version)
        run: python3 tools/check_version.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [disaster_t3s3_sx1262_wifi, disaster_tlora_v2_1_sx1276_wifi, disaster_heltec_v2_sx1276_wifi, disaster_t3s3_sx1262_repeater, disaster_t3s3_sx1262_room, disaster_ttgo_repeater, disaster_ttgo_room]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-mc-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'platformio.local.ini', 'variants/**/platformio.ini') }}
      - run: pip install -U platformio
      - name: Weboberfläche einbetten (Prüfung)
        run: python tools/embed_web.py && git diff --exit-code -- examples/companion_radio/PortalPage.h examples/companion_radio/PortalAssets.h
      - name: Firmware bauen
        run: pio run -e ${{ matrix.env }}
      - name: Dateisystem bauen
        run: pio run -e ${{ matrix.env }} -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/spiffs.bin
          if-no-files-found: error
