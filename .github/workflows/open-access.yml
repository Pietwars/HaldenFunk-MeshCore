name: Open access regression
on:
  push:
    # Nur main und Versions-Tags; PR-Branches laufen über pull_request (keine Doppelläufe push + pull_request)
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run transport and command-boundary tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/open_access_fakes tests/open_access.test.cpp -o /tmp/open-access-test
          /tmp/open-access-test
      - name: Room-Server mit Gast-Passwort hello (Admin unverändert)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/room_access.test.cpp -o /tmp/room-access-test
          /tmp/room-access-test
      - name: Verlauf/Outbox-Dateien mit SPIFFS-Verhalten (fehlende Datei = Verzeichnis-Handle)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/slot_file.test.cpp -o /tmp/slot-file-test
          /tmp/slot-file-test
      - name: Nachrichten zwischen Weboberflaeche und MeshCore-App teilen (gemeinsame Warteschlange)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/open_access_fakes tests/shared_queue.test.cpp -o /tmp/shared-queue-test
          /tmp/shared-queue-test
      - name: Akku-Anzeige (Ladestand aus Spannung, Verbrauchstrend, Texte)
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined tests/batt_trend.test.cpp -o /tmp/batt-trend-test
          /tmp/batt-trend-test
