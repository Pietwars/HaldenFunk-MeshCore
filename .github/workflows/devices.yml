name: Alle Geräte (MeshCore-Konfigurator-Liste)
on:
  push:
    branches: [main]
    paths: ['tools/devices.json', 'platformio.devices.ini', 'tools/build_device.sh', 'examples/**', 'src/**', 'variants/**', '.github/workflows/devices.yml']
  pull_request:
  workflow_dispatch:
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.m.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      # Volle Geräteliste nur auf main, Tags und bei manuellem Start; in PRs (und auf anderen Branches) nur die Kern-Boards:
      # LILYGO T3-S3 SX1262, LILYGO T3 V1.6.1 (TTGO LoRa32, SX1276), Heltec V2 (SX1276), Heltec V3 (ESP32-S3) und RAK4631 (nRF52).
      # Releases bauen weiterhin alle Geräte (release.yml).
      - id: m
        env:
          VOLL: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
          KERN: LilyGo_T3S3_sx1262 LilyGo_TLora_V2_1_1_6 Heltec_v2 Heltec_v3 RAK_4631
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          alle = [d['device'] for d in json.load(open('tools/devices.json'))]
          if os.environ['VOLL'] == 'true':
              liste = alle
          else:
              kern = os.environ['KERN'].split()
              fehlt = [k for k in kern if k not in alle]
              if fehlt:
                  raise SystemExit(f"Kern-Boards fehlen in tools/devices.json: {fehlt}")
              liste = kern
          print(f"devices={json.dumps(liste)}")
          PY
          echo "Matrix: $(tail -n1 "$GITHUB_OUTPUT")"
  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Volle Matrix (main) mit höchstens 10 parallelen Jobs, damit das Konto-Limit (~20) nicht blockiert; PRs bauen ohnehin nur 5 Kern-Boards
      max-parallel: 10
      matrix:
        device: ${{ fromJson(needs.setup.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: chip
        run: echo "chip=$(python3 -c "import json;print({d['device']:d for d in json.load(open('tools/devices.json'))}['${{ matrix.device }}']['chip'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-dev-${{ steps.chip.outputs.chip }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
      - run: pip install -U platformio esptool
      - name: Bauen und packen
        run: tools/build_device.sh "${{ matrix.device }}" dist/devices
      - name: Paket pruefen (factory.bin, Teile, spiffs.bin, SHA256SUMS, ANLEITUNG)
        run: python3 tools/verify_package.py dist/devices/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-${{ matrix.device }}
          path: |
            dist/devices/*.zip
            dist/devices/*.log
          if-no-files-found: error
