# LILYGO TTGO LoRa32 T3 V1.6.1 (classic ESP32, SX1276, SSD1306). Alias of disaster_ttgo_wifi
# (MeshCore variant lilygo_tlora_v2_1, RST fixed to 23 as on the V1.6.1 board).
[env:disaster_tlora_v2_1_sx1276_wifi]
extends = env:disaster_ttgo_wifi
build_flags =
  ${env:disaster_ttgo_wifi.build_flags}

# Heltec WiFi LoRa 32 V2 (classic ESP32, SX1276, SSD1306). MeshCore variant heltec_v2 + HaldenFunk-MeshCore portal.
[env:disaster_heltec_v2_sx1276_wifi]
extends = env:Heltec_v2_companion_radio_usb
test_framework = custom
lib_ldf_mode = deep+
board_build.partitions = huge_app.csv
build_unflags =
  -D LORA_TX_POWER=20
  -D MAX_CONTACTS=160
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
build_flags =
  ${Heltec_lora32_v2.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D DISASTER_PORTAL=1
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_VERSION='"v1.18.0-hf${hf.version}-heltecv2-wifi"'
  -D DISASTER_DIAG=1
  -D DISASTER_WIFI_TX=WIFI_POWER_8_5dBm
  -D DISASTER_WIFI_DELAY_MS=2000
  ; Klassischer ESP32 ohne PSRAM: NimBLE statt Bluedroid (Heap fuer WLAN-Portal + BLE gleichzeitig)
  ${dar_classic_nimble.build_flags}
build_src_filter = ${env:Heltec_v2_companion_radio_usb.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${Heltec_lora32_v2.lib_deps}
  densaugeo/base64 @ ~1.4.0
  SPI
  Wire
  ${dar_classic_nimble.lib_deps}
lib_ignore =
  ${hf_no_bluedroid.lib_ignore}

# Diagnostic build for Heltec V2 boot loops: early serial markers, brownout off, low WiFi TX, staggered init.
[env:disaster_heltec_v2_sx1276_wifi_diag]
extends = env:disaster_heltec_v2_sx1276_wifi
board_build.f_flash = 40000000L
board_build.flash_mode = dio
build_flags =
  ${env:disaster_heltec_v2_sx1276_wifi.build_flags}
  -D DISASTER_DIAG=1
  -D CORE_DEBUG_LEVEL=3
