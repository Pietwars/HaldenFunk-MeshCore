build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D P_LORA_RESET=23
  -D DISASTER_REPEATER=1
  -D DISABLE_WIFI_OTA=1
  -D ADMIN_PASSWORD='""'
  -D ADVERT_NAME='"HaldenFunk-Repeater"'
