# Einzige Versionsquelle von HaldenFunk-MeshCore. Firmwarekennung = v1.18.0-hf${hf.version}[-Rolle];
# tools/version.py liest den Wert fuer Paketnamen, Geraeteliste, Demo-Banner und tools/check_version.py.
[hf]
version = 0.1.1-alpha

# Gemeinsame Einstellungen fuer klassische ESP32 (ohne PSRAM) mit WLAN-Portal + BLE-Companion.
# Bluedroid + BR/EDR-Controller + WLAN-softAP ueberschreiten dort den internen Heap (abort() in
# operator new beim Portal-Start, Bootschleife). NimBLE gibt den Classic-BT-Speicher frei.
[dar_classic_nimble]
build_flags =
  -D DISASTER_NIMBLE=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
lib_deps =
  h2zero/NimBLE-Arduino @ 1.4.3

# Schlanke Profile fuer klassische ESP32 (TTGO/T3 V1.6.1, TLora V2.1-1.6, Heltec V2, T-Beam, Meshadventurer).
# Die Variante LilyGo_TLora_V2_1_1_6 zieht ueber sensor_base ~15 Sensorbibliotheken (BME280/680, INA*,
# SHT4x, VL53L0X, MicroNMEA ...), und ihr build_unflags = -Os nimmt die Optimierung ganz weg (-O0).
# Portal-/Repeater-/Room-Profile ohne Zusatzsensoren: nur benoetigte Bibliotheken, Sensoren per
# lib_ignore gesperrt (ENV_INCLUDE_* sind aus, der Sensorcode faellt beim Kompilieren weg), -Os aktiv.
[hf_classic_slim]
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
lib_ignore =
  Adafruit INA3221 Library
  Adafruit INA219
  INA226
  Adafruit INA260 Library
  Adafruit AHTX0
  Adafruit BME280 Library
  Adafruit BMP280 Library
  Adafruit SHTC3 Library
  Sensirion I2C SHT4x
  Sensirion Core
  Arduino_LPS22HB
  Adafruit MLX90614 Library
  Adafruit_VL53L0X
  MicroNMEA
  Adafruit BME680 Library
  Adafruit BMP085 Library
  BSEC Software Library
  Adafruit Unified Sensor

# NimBLE-Profile (dar_classic_nimble): die Bluedroid-Bibliothek "ESP32 BLE Arduino" und
# SerialBLEInterface.cpp werden nicht gebraucht und nicht mehr mitgebaut.
[hf_no_bluedroid]
lib_ignore =
  ESP32 BLE Arduino
  BSEC Software Library

[env:disaster_ttgo_wifi]
test_framework = custom
lib_ldf_mode = deep+
board_build.partitions = huge_app.csv
extends = env:LilyGo_TLora_V2_1_1_6_companion_radio_usb
build_unflags =
  ; -Os NICHT entfernen (Variante nimmt es weg -> -O0, ~0,5 MB groesser)
  -D LORA_TX_POWER=20
  -D P_LORA_RESET=14
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D P_LORA_RESET=23
  -D DISASTER_PORTAL=1
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_VERSION='"v1.18.0-hf${hf.version}"'
  ; Klassischer ESP32 ohne PSRAM: NimBLE statt Bluedroid (Heap fuer WLAN-Portal + BLE gleichzeitig)
  ${dar_classic_nimble.build_flags}
build_src_filter = ${env:LilyGo_TLora_V2_1_1_6_companion_radio_usb.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${hf_classic_slim.lib_deps}
  densaugeo/base64 @ ~1.4.0
  ${dar_classic_nimble.lib_deps}
lib_ignore =
  ${hf_classic_slim.lib_ignore}
  ${hf_no_bluedroid.lib_ignore}

# Dedicated relay role. No portal, BLE or Wi-Fi OTA; USB CLI for setup.
[env:disaster_ttgo_repeater]
