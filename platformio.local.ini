# Gemeinsame Einstellungen fuer klassische ESP32 (ohne PSRAM) mit WLAN-Portal + BLE-Companion.
# Bluedroid + BR/EDR-Controller + WLAN-softAP ueberschreiten dort den internen Heap (abort() in
# operator new beim Portal-Start, Bootschleife). NimBLE gibt den Classic-BT-Speicher frei.
[dar_classic_nimble]
build_flags =
  -D DISASTER_NIMBLE=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
lib_deps =
  h2zero/NimBLE-Arduino @ 1.4.3

[env:disaster_ttgo_wifi]
test_framework = custom
lib_ldf_mode = deep+
board_build.partitions = huge_app.csv
extends = env:LilyGo_TLora_V2_1_1_6_companion_radio_usb
build_unflags =
  ${LilyGo_TLora_V2_1_1_6.build_unflags}
  -D LORA_TX_POWER=20
  -D P_LORA_RESET=14
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D P_LORA_RESET=23
  -D DISASTER_PORTAL=1
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_VERSION='"v1.18.0-hf0.1.0-alpha"'
  ; Klassischer ESP32 ohne PSRAM: NimBLE statt Bluedroid (Heap fuer WLAN-Portal + BLE gleichzeitig)
  ${dar_classic_nimble.build_flags}
build_src_filter = ${env:LilyGo_TLora_V2_1_1_6_companion_radio_usb.build_src_filter}
  +<helpers/esp32/*.cpp>
lib_deps =
  ${env:LilyGo_TLora_V2_1_1_6_companion_radio_usb.lib_deps}
  ${dar_classic_nimble.lib_deps}

