; HaldenFunk T-Deck Plus Standalone – Portierungsprofil von DisAHRsterRadio 0.9.5.
; Noch nicht flashen: Quellcode/Assets/Buildprüfung müssen vor Hardwaretest portiert werden.
; Gleiche MeshCore-Funkparameter wie DAR (10 dBm); regionale Darstellung getrennt.
[env:HaldenFunk_TDeck_standalone]
extends = env:LilyGo_TDeck_companion_radio_ble
lib_ldf_mode = deep+
build_unflags =
  -D LORA_TX_POWER=22
board_build.partitions = huge_app.csv
build_flags =
  ${env:LilyGo_TDeck_companion_radio_ble.build_flags}
  -D LORA_TX_POWER=10
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=64
  -D DISASTER_STANDALONE=1
  -D DISASTER_SD=1
  -D PIN_SD_CS=39
  -D PIN_TB_UP=3
  -D PIN_TB_DOWN=15
  -D PIN_TB_LEFT=1
  -D PIN_TB_RIGHT=2
  -D FIRMWARE_VERSION='"v1.18.0-hf${hf.version}-standalone-dev"'
build_src_filter = ${env:LilyGo_TDeck_companion_radio_ble.build_src_filter}
  -<../examples/companion_radio/WebFrontend.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
lib_ignore =
  WiFi
  WiFiClientSecure
  WebServer
  DNSServer
  ESPmDNS
  HTTPClient
  HTTPUpdate
  AsyncTCP
  ESPAsyncWebServer
  ESP Async WebServer
  AsyncElegantOTA
lib_deps =
  ${env:LilyGo_TDeck_companion_radio_ble.lib_deps}
